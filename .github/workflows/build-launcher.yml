name: Build Nadeko Launcher (standalone APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Locate APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "No APK found under app/build/outputs/apk"
            find app/build/outputs -type f
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Rename APK with build info
        id: rename
        run: |
          mkdir -p artifacts
          BUILD_DATE_JKT=$(TZ="Asia/Jakarta" date '+%Y%m%d-%H%M')
          SHORT_SHA=$(git rev-parse --short HEAD)
          NEW_NAME="NadekoLauncher-${BUILD_DATE_JKT}-${SHORT_SHA}.apk"
          cp "${{ steps.locate.outputs.apk_path }}" "artifacts/${NEW_NAME}"
          MD5SUM=$(md5sum "artifacts/${NEW_NAME}" | awk '{print $1}')
          echo "$MD5SUM  ${NEW_NAME}" > "artifacts/${NEW_NAME}.md5"
          echo "apk_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "md5sum=${MD5SUM}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadeko-launcher-apk
          path: ./artifacts

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_NAME: ${{ steps.rename.outputs.apk_name }}
          MD5SUM: ${{ steps.rename.outputs.md5sum }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p artifacts
          cd artifacts

          if [ -n "$APK_NAME" ] && [ -f "$APK_NAME" ]; then
            SIZE=$(du -h "$APK_NAME" | cut -f1)
            BUILD_DATE_JKT=$(TZ="Asia/Jakarta" date '+%Y-%m-%d %H:%M %Z')
            CAPTION=$(cat <<EOF
          Nadeko Launcher (standalone) - ${BUILD_TYPE}
          Size: ${SIZE}
          MD5: \`${MD5SUM}\`
          Built: ${BUILD_DATE_JKT}
          EOF
          )
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "document=@${APK_NAME}" \
                 -F "caption=${CAPTION}" \
                 -F "parse_mode=Markdown" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          else
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "text=Build Nadeko Launcher (${BUILD_TYPE}) GAGAL. Log: ${RUN_URL}" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          fi
        shell: bash
