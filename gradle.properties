# AGP 9.x defaults to built-in Kotlin support, yang bentrok sama plugin
# org.jetbrains.kotlin.android yang kita pasang manual di build.gradle.kts.
# Opt-out ini resmi didukung sampai AGP 10.0 (escape hatch sementara).
android.builtInKotlin=false
android.newDsl=false

android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official

# Workaround: KSP2 backend punya bug validasi tipe tertentu (array, dll) yang
# bikin Dagger crash dengan DaggerSuperficialValidation$UnexpectedException.
# Balik ke KSP1 backend yang lebih stabil buat kombinasi Dagger+KSP ini.
ksp.useKSP2=false
